method: proser
seed: 6304

model:
  known_classes: 10
  dummy_classes: 5
  total_classes: 15
  initialization_checkpoint: task4/checkpoints/vanilla_best.pt

data:
  batch_size: 128
  num_workers: 2
  randaugment: false

training:
  epochs: 50
  optimizer: sgd
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  checkpoint_metric: validation_accuracy

proser:
  beta: 1.0
  gamma: 0.1
  mixup_alpha: 2.0
  mixup_location: after_layer2
  ordinary_batch_fraction: 0.5
  placeholder_batch_fraction: 0.5

output:
  checkpoint: task4/checkpoints/proser_best.pt
  history: task4/results/proser_training_history.csv