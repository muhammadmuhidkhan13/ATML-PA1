method:
  name: dan_dg
  lambda_dg: 0.1
  kernel_multipliers:
  - 0.5
  - 1.0
  - 2.0
seed: 6304
data:
  images_root: data/pacs/images
  split_path: shared/splits/pacs_sketch_seed6304.json
  source_domains:
  - art_painting
  - cartoon
  - photo
  source_batch_size_per_domain: 8
  num_workers: 0
model:
  feature_dimension: 512
  number_of_classes: 7
  freeze_batchnorm_statistics: true
training:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  maximum_epochs: 30
  early_stopping_patience: 5
  checkpoint_metric: mean_source_validation_macro_f1
  steps_per_epoch: longest_source_loader
controlled_study:
  parameter: lambda_dg
  values:
  - 0.1
  - 1.0
  - 10.0
output:
  results_root: task3/results
  run_name: dan_dg_lambda_0_1
